name: Bug report
description: Something in the CLI did not match the documented behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command, including --delimiter and --encoding if used.
      placeholder: python -m ops_field_brief file.csv --required shipment,buyer
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: Exit code and the report you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Exit code, stdout, and stderr. Do not paste secrets.
    validations:
      required: true
