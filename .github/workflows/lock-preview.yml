name: Temporary regenerate hashed development lock

on:
  push:
    branches:
      - ci/hash-locked-dev-tools-20261026
    paths:
      - .github/workflows/lock-preview.yml

permissions:
  contents: read

jobs:
  create-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install pinned resolver
        run: python -m pip install --disable-pip-version-check uv==0.12.22
      - name: Generate universal SHA-256 hashed lock and validate
        run: |
          uv pip compile requirements-dev.txt --generate-hashes --universal --python-version 3.10 -o requirements-dev.lock
          python scripts/check_dev_lock.py
      - name: Commit generated lock on dedicated maintenance branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-dev.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: generate universal SHA-256 dev lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
