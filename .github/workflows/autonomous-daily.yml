name: Scheduled Engineering Audit

on:
  schedule:
    # Mondays at 09:00 La Paz (UTC-4) = 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduled-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Run unit test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run zero-cost local audit
        # Keep the scheduled cycle local-only: no external AI/API calls and no
        # billable service usage. The script additionally requires an explicit
        # --allow-external-api flag before it can use any API key in its environment.
        run: python scripts/autonomous_agent.py

      - name: Verify test suite post-audit
        run: PYTHONPATH=src python -m unittest discover -s tests -v
