name: Autonomous Daily Engineering Cycle

on:
  schedule:
    # 09:00 La Paz (UTC-4) = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_GEMINI }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run autonomous agent audit & optimization
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_GEMINI }}
        run: python scripts/autonomous_agent.py

      - name: Verify test suite post-audit
        run: PYTHONPATH=src python -m unittest discover -s tests -v
