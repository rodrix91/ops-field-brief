name: Autonomous Daily Engineering Cycle

on:
  schedule:
    # 09:00 La Paz (UTC-4) = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autonomous-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run unit test suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Run zero-cost local audit
        # Keep the scheduled cycle local-only: no external AI/API calls and no
        # billable service usage. The script's optional API path remains
        # available for an explicitly configured manual use outside this cron.
        run: python scripts/autonomous_agent.py

      - name: Verify test suite post-audit
        run: PYTHONPATH=src python -m unittest discover -s tests -v
