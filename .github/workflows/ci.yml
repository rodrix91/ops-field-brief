name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests with branch coverage
        env:
          PYTHONPATH: src
        run: |
          coverage run -m unittest discover -s tests
          coverage combine
          coverage report
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v


  platforms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v


  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: python -m pip wheel --disable-pip-version-check --no-deps --wheel-dir "$RUNNER_TEMP/dist" .
      - name: Build and inspect source distribution
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist" .
          python - <<'PY'
          import glob
          import os
          import tarfile

          archive = glob.glob(
              os.path.join(os.environ["RUNNER_TEMP"], "sdist", "*.tar.gz")
          )[0]
          with tarfile.open(archive, "r:gz") as tar:
              names = set(tar.getnames())

          roots = {name.split("/", 1)[0] for name in names if "/" in name}
          assert len(roots) == 1, sorted(roots)
          root = roots.pop()
          required = {
              f"{root}/SECURITY.md",
              f"{root}/CONTRIBUTING.md",
              f"{root}/CITATION.cff",
              f"{root}/docs/README.md",
              f"{root}/src/ops_field_brief/py.typed",
          }
          missing = required - names
          assert not missing, sorted(missing)
          PY

      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check --no-deps "$RUNNER_TEMP"/dist/*.whl
      - name: Verify installed metadata and command
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import importlib.metadata
          from pathlib import Path

          import ops_field_brief

          installed = importlib.metadata.version("ops-field-brief")
          runtime = ops_field_brief.__version__
          assert installed == runtime, (installed, runtime)

          marker = Path(ops_field_brief.__file__).with_name("py.typed")
          assert marker.is_file(), marker
          PY
          "$RUNNER_TEMP/venv/bin/ops-field-brief" examples/shipments.csv --required shipment --key shipment --max-duplicates 1 > /dev/null

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Action passes when enabled gates pass
        id: ok
        uses: ./
        with:
          path: examples/shipments.csv
          args: --required shipment --key shipment --max-duplicates 1
          summary: "false"

      - name: Action fails when a quality gate fails
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: examples/shipments.csv
          args: --required shipment --key shipment --max-duplicates 0
          summary: "false"

      - name: Action rejects paths outside the caller workspace
        id: escape
        continue-on-error: true
        uses: ./
        with:
          path: ../outside-workspace.csv
          args: --required shipment
          summary: "false"

      - name: Action rejects help without reporting a CSV success
        id: help
        continue-on-error: true
        uses: ./
        with:
          path: examples/shipments.csv
          args: --help
          summary: "false"

      - name: Action rejects version without reporting a CSV success
        id: version
        continue-on-error: true
        uses: ./
        with:
          path: examples/shipments.csv
          args: --version
          summary: "false"

      - name: Action rejects abbreviated version bypass
        id: short-version
        continue-on-error: true
        uses: ./
        with:
          path: examples/shipments.csv
          args: --ver
          summary: "false"

      - name: Action fails when composite business keys are incomplete
        id: incomplete
        continue-on-error: true
        uses: ./
        with:
          path: examples/orders-incomplete-keys.csv
          args: --required order_id --max-missing 1 --key order_id,line_id --max-incomplete-keys 1 --json
          summary: "false"

      - name: Action accepts the configured incomplete-key allowance
        id: incomplete-allowed
        uses: ./
        with:
          path: examples/orders-incomplete-keys.csv
          args: --required order_id --max-missing 1 --key order_id,line_id --max-incomplete-keys 2 --json
          summary: "false"

      - name: Reject a NaN missing-data gate
        id: nan-threshold
        continue-on-error: true
        uses: ./
        with:
          path: examples/shipments.csv
          args: --required buyer --max-missing NaN
          summary: "false"

      - name: Verify action outputs
        env:
          HELP_CODE: ${{ steps.help.outputs.exit-code }}
          HELP_PASSED: ${{ steps.help.outputs.passed }}
          HELP_OUTCOME: ${{ steps.help.outcome }}
          VERSION_CODE: ${{ steps.version.outputs.exit-code }}
          VERSION_PASSED: ${{ steps.version.outputs.passed }}
          VERSION_OUTCOME: ${{ steps.version.outcome }}
          SHORT_VERSION_CODE: ${{ steps.short-version.outputs.exit-code }}
          SHORT_VERSION_PASSED: ${{ steps.short-version.outputs.passed }}
          SHORT_VERSION_OUTCOME: ${{ steps.short-version.outcome }}
          ESCAPE_CODE: ${{ steps.escape.outputs.exit-code }}
          ESCAPE_PASSED: ${{ steps.escape.outputs.passed }}
          ESCAPE_OUTCOME: ${{ steps.escape.outcome }}
          INCOMPLETE_CODE: ${{ steps.incomplete.outputs.exit-code }}
          INCOMPLETE_PASSED: ${{ steps.incomplete.outputs.passed }}
          INCOMPLETE_OUTCOME: ${{ steps.incomplete.outcome }}
          INCOMPLETE_ALLOWED_CODE: ${{ steps.incomplete-allowed.outputs.exit-code }}
          INCOMPLETE_ALLOWED_PASSED: ${{ steps.incomplete-allowed.outputs.passed }}
          NAN_THRESHOLD_CODE: ${{ steps.nan-threshold.outputs.exit-code }}
          NAN_THRESHOLD_PASSED: ${{ steps.nan-threshold.outputs.passed }}
          NAN_THRESHOLD_OUTCOME: ${{ steps.nan-threshold.outcome }}
          OK_CODE: ${{ steps.ok.outputs.exit-code }}
          OK_PASSED: ${{ steps.ok.outputs.passed }}
          GATE_CODE: ${{ steps.gate.outputs.exit-code }}
          GATE_PASSED: ${{ steps.gate.outputs.passed }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          test "$HELP_CODE" = 2
          test "$HELP_PASSED" = false
          test "$HELP_OUTCOME" = failure
          test "$VERSION_CODE" = 2
          test "$VERSION_PASSED" = false
          test "$VERSION_OUTCOME" = failure
          test "$SHORT_VERSION_CODE" = 2
          test "$SHORT_VERSION_PASSED" = false
          test "$SHORT_VERSION_OUTCOME" = failure
          test "$INCOMPLETE_CODE" = 1
          test "$INCOMPLETE_PASSED" = false
          test "$INCOMPLETE_OUTCOME" = failure
          test "$INCOMPLETE_ALLOWED_CODE" = 0
          test "$INCOMPLETE_ALLOWED_PASSED" = true
          test "$NAN_THRESHOLD_CODE" = 2
          test "$NAN_THRESHOLD_PASSED" = false
          test "$NAN_THRESHOLD_OUTCOME" = failure
          test "$OK_CODE" = 0
          test "$OK_PASSED" = true
          test "$GATE_CODE" = 1
          test "$GATE_PASSED" = false
          test "$GATE_OUTCOME" = failure
          test "$ESCAPE_CODE" = 2
          test "$ESCAPE_PASSED" = false
          test "$ESCAPE_OUTCOME" = failure
