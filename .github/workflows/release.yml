name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          version=$(PYTHONPATH=src python -c "import ops_field_brief; print(ops_field_brief.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          fi

      - name: Verify fully hashed build dependency lock
        run: python scripts/check_dev_lock.py

      - name: Install fully hashed build and test tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock

      - name: Build wheel and source distribution
        run: python -m build --outdir dist .

      - name: Test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          test "$("$RUNNER_TEMP/wheel-venv/bin/ops-field-brief" --version)" = "ops-field-brief ${TAG#v}"
          "$RUNNER_TEMP/wheel-venv/bin/ops-field-brief" examples/shipments.csv \
            --required shipment --key shipment --max-duplicates 1 > /dev/null

      - name: Test the source distribution
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Write SHA-256 checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish a new GitHub release without altering existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases are immutable historical artifacts. A rerun must not
          # silently replace a previously published wheel or source archive.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published files."
            exit 1
          fi
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
