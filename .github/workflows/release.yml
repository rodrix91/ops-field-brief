name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        run: |
          version=$(PYTHONPATH=src python -c "import ops_field_brief; print(ops_field_brief.__version__)")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package version $version"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --disable-pip-version-check build

      - name: Build wheel and source distribution
        run: python -m build --outdir dist .

      - name: Test the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pip install --disable-pip-version-check --no-deps dist/*.whl
          test "$("$RUNNER_TEMP/wheel-venv/bin/ops-field-brief" --version)" = "ops-field-brief ${TAG#v}"
          "$RUNNER_TEMP/wheel-venv/bin/ops-field-brief" examples/shipments.csv \
            --required shipment --key shipment --max-duplicates 1 > /dev/null

      - name: Test the source distribution
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/*/
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
