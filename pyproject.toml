[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-field-brief"
dynamic = ["version"]
description = "Operational CSV checks for required-field fill, repeated keys, row counts, and group concentration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rodrigo Pantoja Navajas"}]
keywords = ["csv", "data-quality", "operations", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]


[project.urls]
Homepage = "https://github.com/rodrix91/ops-field-brief"
Changelog = "https://github.com/rodrix91/ops-field-brief/blob/main/CHANGELOG.md"
Issues = "https://github.com/rodrix91/ops-field-brief/issues"
Contributing = "https://github.com/rodrix91/ops-field-brief/blob/main/CONTRIBUTING.md"
Documentation = "https://github.com/rodrix91/ops-field-brief/tree/main/docs"
Security = "https://github.com/rodrix91/ops-field-brief/security"
Citation = "https://github.com/rodrix91/ops-field-brief/blob/main/CITATION.cff"

[project.scripts]
ops-field-brief = "ops_field_brief.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ops_field_brief.__version__"}

[tool.setuptools.package-data]
ops_field_brief = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["ops_field_brief"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90
